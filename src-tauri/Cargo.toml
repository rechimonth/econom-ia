[package]
name = "econom-ia"
version = "1.0.0"
description = "Gestión financiera personal inteligente"
authors = ["Econom-IA"]
edition = "2021"
license = "UNLICENSED"
rust-version = "1.77"

[lib]
name = "econom_ia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
